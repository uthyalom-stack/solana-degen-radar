name = "solana-degen-radar-worker"
main = "src/index.ts"
compatibility_date = "2026-11-04"
workers_dev = false

[vars]
APP_ENV = "production"
DASHBOARD_ORIGIN = "http://localhost:3000"
PAPER_STARTING_BALANCE = "5"
DEXSCREENER_BASE_URL = "https://api.dexscreener.com"
SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
SOCIAL_RSS_FEEDS = ""\nX_SEARCH_QUERIES = ""\nX_TRACKED_ACCOUNTS = ""\nX_SCAN_INTERVAL_MINUTES = "15"
JITO_TIP_ACCOUNTS = ""
BRIDGE_PROGRAM_IDS = ""
SOLANA_DISCOVERY_PROGRAM_IDS = ""

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "solana-degen-radar"
database_id = "REPLACE_AFTER_CREATING_D1"
migrations_dir = "../../migrations"

[[durable_objects.bindings]]
name = "PUMPPORTAL_STREAM"
class_name = "PumpPortalStream"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PumpPortalStream"]
